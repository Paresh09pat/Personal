# Render Blueprint — FREE plan.
# Free web services sleep after 15 min without traffic (~1 min to wake) and their disk is wiped,
# so photos/videos are stored in MongoDB (STORAGE_DRIVER=mongo). APP_ORIGIN is detected automatically.
# For an always-on setup switch to plan: starter and add a disk (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: our-little-world
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string when Render asks
      - key: SESSION_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: REGISTRATION_MODE
        value: invite_only
      - key: STORAGE_DRIVER
        value: mongo
